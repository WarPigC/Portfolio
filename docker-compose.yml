services:
  portfolio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: portfolio
    platform: linux/arm64

    ports:
      - "8081:8081"

    restart: unless-stopped

    mem_limit: 128m
    memswap_limit: 192m

    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8081/')" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
